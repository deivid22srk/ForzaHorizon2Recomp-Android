name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar NDK/CMake (SDK pré-instalado no runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.31.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configurar CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.1

      # O .xex é conteúdo protegido: nunca commitado. Serve apenas para
      # análise/recompilação offline. O APK final não o embute — o usuário
      # fornece os arquivos em runtime via SAF.
      - name: Baixar default.xex (repo privado, opcional)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then echo "GH_PAT ausente, pulando download (build runtime-only)."; exit 0; fi
          curl -L --retry 3 --retry-delay 5 \
               -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o default.xex \
               "https://github.com/deivid22srk/forza-horizon-2-xex/raw/refs/heads/main/default.xex"
          test -s default.xex || (echo "default.xex vazio/ausente" && exit 1)
          head -c 4 default.xex | grep -q "XEX2" || (echo "Magic XEX2 inválido" && exit 1)
          echo "default.xex OK: $(stat -c%s default.xex) bytes"

      - name: Tentar codegen XenonRecomp (não-bloqueante)
        run: |
          if [ ! -f default.xex ]; then echo "Sem default.xex — build runtime-only."; exit 0; fi
          set +e
          if [ -f ./tools/run_recomp.sh ]; then
            chmod +x ./tools/*.sh || true
            echo "XEX presente; codegen real exige checkout do XenonRecomp (ver docs/recomp.md)."
            echo "Build segue em modo runtime-only (válido para CI)."
          fi
          exit 0

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build APK (Release)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
